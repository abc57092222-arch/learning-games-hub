<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九九乘法冒險島：直覺探索與速算實驗室</title>
  <style>
/* === Style: ../../shared/styles/tokens.css === */
:root {
  --bg-canvas: #faf6ee;
  --bg-card: #ffffff;
  --bg-subtle: #f1f5f9;
  --ink-primary: #1e293b;
  --ink-secondary: #475569;
  --border-soft: #cbd5e1;

  --x-color: #1d4ed8;
  --x-bg: #dbeafe;
  --y-color: #b45309;
  --y-bg: #fef3c7;

  --clue1-color: #4338ca;
  --clue1-bg: #e0e7ff;
  --clue2-color: #047857;
  --clue2-bg: #d1fae5;

  --ok-color: #15803d;
  --ok-bg: #dcfce7;
  --err-color: #b91c1c;
  --err-bg: #fee2e2;

  --target-size: 24px;
  --radius-lg: 16px;
  --radius-md: 11px;
  --shadow-card: 0 4px 14px rgb(15 23 42 / 0.06);
}

@media (pointer: coarse) {
  :root {
    --target-size: 44px;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  color-scheme: light;
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-canvas);
  color: var(--ink-primary);
}

body {
  margin: 0;
  min-block-size: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-wrap: break-word;
  line-height: 1.55;
}

h1, h2, h3 {
  text-wrap: balance;
  margin-top: 0;
}

p, li {
  text-wrap: pretty;
}

:where(a, code) {
  overflow-wrap: anywhere;
}

img, svg {
  max-inline-size: 100%;
  block-size: auto;
}

/* Visually hidden utility (accessible to screen readers; reveals on focus) */
.visually-hidden:where(:not(:focus-within, :active)) {
  position: absolute !important;
  clip-path: inset(50%) !important;
  overflow: hidden !important;
  width: 1px !important;
  height: 1px !important;
  margin: -1px !important;
  padding: 0 !important;
  border: 0 !important;
  white-space: nowrap !important;
}

.skip-link:focus {
  position: fixed;
  top: 0.75rem;
  left: 0.75rem;
  z-index: 1000;
  background: #1e293b;
  color: #ffffff;
  padding: 0.6rem 1rem;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
}

/* Minimum touch/click target sizing & natural interaction feedback */
:where(button, select, textarea, input:not([type="checkbox"], [type="radio"]), [role="button"], nav a, .back-hub-link, label:has(input[type="checkbox"], input[type="radio"])) {
  min-block-size: var(--target-size);
  min-inline-size: var(--target-size);
}

:where(button) {
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  transition: box-shadow 150ms ease-out, scale 150ms ease-out, background-color 150ms ease-out, border-color 150ms ease-out;
}

button:hover:not(:disabled) {
  box-shadow: 0 3px 10px rgb(15 23 42 / 0.14);
}

button:active:not(:disabled) {
  scale: 0.97;
}

button:disabled {
  opacity: 0.52;
  cursor: not-allowed;
}

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 3px solid #1e293b;
  outline-offset: 3px;
}

/* Shared Header, Main & Footer */
.app-header {
  background: #ffffff;
  border-bottom: 2px solid #e2e8f0;
  padding: 0.75rem max(1rem, env(safe-area-inset-right, 0px)) 0.75rem max(1rem, env(safe-area-inset-left, 0px));
  padding-top: max(0.75rem, env(safe-area-inset-top, 0px));
}

.header-inner {
  max-width: 1240px;
  margin-inline: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

.brand-cluster {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}

.brand-icon {
  font-size: 1.9rem;
  line-height: 1;
}

.brand-title {
  font-size: clamp(1.02rem, 1.5vw, 1.25rem);
  font-weight: 800;
  margin: 0;
  color: var(--ink-primary);
}

.brand-subtitle {
  margin: 0;
  font-size: 0.8rem;
  color: var(--ink-secondary);
}

.primary-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}

.nav-pill, .tool-btn, .pill-btn {
  background: var(--bg-subtle);
  color: var(--ink-primary);
  border: 1.5px solid var(--border-soft);
  border-radius: 999px;
  padding: 0.42rem 0.9rem;
  font-size: 0.88rem;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
}

.back-hub-link:hover {
  box-shadow: 0 3px 10px rgb(15 23 42 / 0.14);
}

.nav-pill.is-active, .pill-btn.is-active {
  background: #1e293b;
  color: #ffffff;
  border-color: #1e293b;
}

.header-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
}

.stars-counter {
  background: #fef3c7;
  color: #92400e;
  border: 1.5px solid #fcd34d;
  border-radius: 999px;
  padding: 0.35rem 0.75rem;
  font-weight: 800;
  font-size: 0.88rem;
}

.app-main {
  flex: 1 0 auto;
  width: 100%;
  max-width: 1240px;
  margin-inline: auto;
  padding: 1rem max(1rem, env(safe-area-inset-right, 0px)) 2rem max(1rem, env(safe-area-inset-left, 0px));
}

.app-footer {
  text-align: center;
  font-size: 0.8rem;
  color: var(--ink-secondary);
  padding: 0.9rem 1rem max(0.9rem, env(safe-area-inset-bottom, 0px));
  border-top: 1px solid #e2e8f0;
  background: #ffffff;
}

/* Native <dialog> styling & Top-Layer Animations */
dialog.lab-dialog {
  width: min(92vw, 820px);
  max-height: 86dvh;
  border: 2px solid #cbd5e1;
  border-radius: var(--radius-lg);
  padding: 0;
  background: #ffffff;
  color: var(--ink-primary);
  box-shadow: 0 24px 48px rgb(15 23 42 / 0.25);
  opacity: 0;
  transition-property: opacity, transform, display, overlay;
  transition-duration: 0.25s;
  transition-timing-function: ease-out;
  transition-behavior: allow-discrete;
}

@media (prefers-reduced-motion: no-preference) {
  dialog.lab-dialog {
    transform: scale(0.94);
  }
}

dialog.lab-dialog:modal {
  overscroll-behavior: contain;
}

dialog.lab-dialog::backdrop {
  background-color: rgba(15, 23, 42, 0);
  overflow: hidden;
  overscroll-behavior: contain;
  transition-property: background-color, display, overlay;
  transition-duration: 0.25s;
  transition-timing-function: ease-out;
  transition-behavior: allow-discrete;
}

:is(dialog.lab-dialog[open]):where(:not([data-closing])) {
  display: flex;
  flex-direction: column;
  opacity: 1;
}

@starting-style {
  :is(dialog.lab-dialog[open]):where(:not([data-closing])) {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: no-preference) {
  :is(dialog.lab-dialog[open]):where(:not([data-closing])) {
    transform: scale(1);
  }
  @starting-style {
    :is(dialog.lab-dialog[open]):where(:not([data-closing])) {
      transform: scale(0.94);
    }
  }
}

:is(dialog.lab-dialog[open]):where(:not([data-closing]))::backdrop {
  background-color: rgba(15, 23, 42, 0.48);
}

@starting-style {
  :is(dialog.lab-dialog[open]):where(:not([data-closing]))::backdrop {
    background-color: rgba(15, 23, 42, 0);
  }
}

@media (prefers-reduced-motion: reduce) {
  dialog.lab-dialog,
  dialog.lab-dialog::backdrop {
    transition-duration: 0.1s;
  }
}

.dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.9rem 1.2rem;
  border-bottom: 1.5px solid #e2e8f0;
}

.dialog-header h2 {
  margin: 0;
  font-size: 1.15rem;
}

.dialog-close-btn {
  background: #f1f5f9;
  border: 1.5px solid #cbd5e1;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-weight: 800;
}

.dialog-body {
  padding: 1rem 1.2rem;
  overflow-y: auto;
}


/* === Style: ./src/styles/game.css === */
/* Multiplication Grid & Adventure styling */

.game-shell {
  max-width: 960px;
  margin: 0 auto;
  padding: var(--space-4) var(--space-3) var(--space-12);
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-bottom: var(--space-6);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
}

.header-left {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.game-title {
  font-size: var(--font-size-2xl);
  font-weight: 800;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.stats-bar {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  background: var(--bg-surface);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-sm);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--font-size-sm);
  font-weight: 700;
}

.stat-stars {
  color: #d97706;
}

/* Tabs */
.mode-tabs {
  display: flex;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
  background: var(--bg-surface-elevated, #f1f5f9);
  padding: var(--space-1);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
}

.tab-btn {
  flex: 1;
  padding: var(--space-2) var(--space-4);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: var(--font-size-base);
  font-weight: 700;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 44px;
}

.tab-btn:hover {
  color: var(--text-primary);
}

.tab-btn.active {
  background: var(--bg-surface, #ffffff);
  color: var(--color-primary-600, #0284c7);
  box-shadow: var(--shadow-sm);
}

/* Screen Layouts */
.screen-panel {
  background: var(--bg-surface);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-md);
}

.hidden {
  display: none !important;
}

/* Sandbox Visualizer */
.sandbox-controls {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  align-items: center;
  margin-bottom: var(--space-6);
  padding: var(--space-4);
  background: var(--bg-surface-elevated, #f8fafc);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
}

.control-group {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 700;
}

.number-selector {
  display: flex;
  gap: var(--space-1);
}

.num-pill {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  cursor: pointer;
  font-weight: bold;
  font-size: var(--font-size-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}

.num-pill:hover {
  border-color: #0284c7;
  color: #0284c7;
}

.num-pill.active {
  background: #0284c7;
  color: #ffffff;
  border-color: #0284c7;
}

.viz-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4);
}

.array-svg-wrapper {
  max-width: 100%;
  overflow-x: auto;
  display: flex;
  justify-content: center;
}

.array-svg {
  max-width: 100%;
  height: auto;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.formula-card {
  font-size: var(--font-size-2xl);
  font-weight: 800;
  color: #0369a1;
  background: #e0f2fe;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

/* Adventure Map & Play Card */
.level-select-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--space-4);
  margin-top: var(--space-4);
}

.level-card {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  background: var(--bg-surface);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  text-align: left;
}

.level-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: #0284c7;
}

.level-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-2);
}

.level-number {
  font-weight: 800;
  font-size: var(--font-size-base);
  color: var(--text-primary);
}

.level-stars {
  font-size: var(--font-size-sm);
  color: #d97706;
}

.level-desc {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
}

/* Play Screen */
.quiz-card {
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
}

.quiz-progress-bar {
  height: 8px;
  background: #e2e8f0;
  border-radius: var(--radius-full);
  margin-bottom: var(--space-4);
  overflow: hidden;
}

.quiz-progress-fill {
  height: 100%;
  background: #0284c7;
  width: 0%;
  transition: width 0.3s ease;
}

.quiz-prompt-box {
  background: #f0f9ff;
  border: 2px solid #bae6fd;
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  margin-bottom: var(--space-6);
}

.quiz-prompt {
  font-size: var(--font-size-3xl);
  font-weight: 900;
  color: #0c4a6e;
  margin-bottom: var(--space-2);
}

.quiz-hint-text {
  font-size: var(--font-size-sm);
  color: #0369a1;
}

.input-row {
  display: flex;
  justify-content: center;
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}

.answer-input {
  width: 140px;
  font-size: var(--font-size-3xl);
  font-weight: 900;
  text-align: center;
  padding: var(--space-2);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  outline: none;
  min-height: 48px;
}

.answer-input:focus-visible {
  border-color: #0284c7;
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
}

.keypad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-2);
  max-width: 280px;
  margin: 0 auto var(--space-6);
}

.key-btn {
  height: 48px;
  font-size: var(--font-size-xl);
  font-weight: 700;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface-elevated, #f8fafc);
  cursor: pointer;
}

.key-btn:hover {
  background: #e2e8f0;
}

.feedback-banner {
  margin-top: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg);
  font-size: var(--font-size-base);
  font-weight: 700;
}

.feedback-banner.success {
  background: #dcfce7;
  color: #15803d;
  border: 1px solid #86efac;
}

.feedback-banner.error {
  background: #fee2e2;
  color: #b91c1c;
  border: 1px solid #fca5a5;
}

/* 9x9 Multiplication Table Matrix */
.table-matrix-wrapper {
  overflow-x: auto;
}

.table-matrix {
  width: 100%;
  border-collapse: collapse;
  text-align: center;
}

.table-matrix th,
.table-matrix td {
  border: 1px solid var(--border-subtle);
  padding: var(--space-2);
  min-width: 44px;
  height: 44px;
}

.table-matrix th {
  background: #f1f5f9;
  font-weight: 800;
  color: #334155;
}

.table-matrix td {
  cursor: pointer;
  font-weight: 700;
  font-size: var(--font-size-sm);
  transition: background 0.15s ease;
}

.table-matrix td:hover {
  background: #bae6fd;
  color: #0369a1;
}

.table-matrix td.selected {
  background: #0284c7;
  color: #ffffff;
}

/* Dialog */
.dialog-content {
  padding: var(--space-6);
  text-align: center;
}

.dialog-stars {
  font-size: var(--font-size-3xl);
  margin: var(--space-4) 0;
}

@media (pointer: coarse) {
  .key-btn,
  .num-pill,
  .tab-btn,
  .tool-btn {
    min-height: 44px;
  }
}

</style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <div class="header-left">
        <a href="../../index.html" class="tool-btn back-hub-link">🏠 回遊戲大廳</a>
        <h1 class="game-title">✖️ 九九乘法冒險島</h1>
      </div>
      <div class="stats-bar">
        <div class="stat-item stat-stars">
          <span id="stat-total-stars">0 / 30 ⭐️</span>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="mode-tabs" role="tablist" aria-label="模式切換">
      <button class="tab-btn active" data-mode="adventure" role="tab">🗺️ 冒險闖關 (10關)</button>
      <button class="tab-btn" data-mode="sandbox" role="tab">🔍 點陣探索沙盒</button>
      <button class="tab-btn" data-mode="table" role="tab">📊 九九乘法總表</button>
    </nav>

    <!-- Panel 1: Adventure Mode -->
    <main id="panel-adventure" class="screen-panel">
      <!-- Screen 1.1: Level Selection Map -->
      <section id="screen-adventure-map">
        <h2 style="font-size:var(--font-size-xl);margin-bottom:8px;">選擇關卡</h2>
        <p style="color:var(--text-secondary);margin-bottom:16px;">
          循序漸進打通乘法概念！觀察點陣圖、破除加法迷思，挑戰成為乘法大宗師！
        </p>
        <div id="level-grid" class="level-select-grid"></div>
      </section>

      <!-- Screen 1.2: Question Play Area -->
      <section id="screen-adventure-play" class="hidden">
        <div class="quiz-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <button id="btn-back-to-map" class="tool-btn" style="min-height:36px;padding:4px 12px;">← 返回地圖</button>
            <span id="quiz-level-title" style="font-weight:700;color:var(--text-secondary);"></span>
          </div>

          <div class="quiz-progress-bar">
            <div id="quiz-progress-fill" class="quiz-progress-fill"></div>
          </div>

          <div class="quiz-prompt-box">
            <div id="quiz-prompt-text" class="quiz-prompt"></div>
            <div id="quiz-hint" class="quiz-hint-text"></div>
          </div>

          <!-- Dynamic SVG Array Helper -->
          <div id="quiz-viz-preview" style="margin-bottom:20px;display:flex;justify-content:center;"></div>

          <div class="input-row">
            <input type="number" id="answer-input" class="answer-input" placeholder="?" aria-label="請輸入答案" />
            <button id="btn-submit-answer" class="tool-btn primary" style="min-height:48px;padding:0 24px;font-size:1.1rem;">送出答案</button>
          </div>

          <!-- Virtual Keypad for touch/coarse devices -->
          <div class="keypad-grid">
            <button class="key-btn" data-val="1">1</button>
            <button class="key-btn" data-val="2">2</button>
            <button class="key-btn" data-val="3">3</button>
            <button class="key-btn" data-val="4">4</button>
            <button class="key-btn" data-val="5">5</button>
            <button class="key-btn" data-val="6">6</button>
            <button class="key-btn" data-val="7">7</button>
            <button class="key-btn" data-val="8">8</button>
            <button class="key-btn" data-val="9">9</button>
            <button class="key-btn" data-val="clear">C</button>
            <button class="key-btn" data-val="0">0</button>
            <button class="key-btn" data-val="backspace">⌫</button>
          </div>

          <div id="quiz-feedback" class="feedback-banner hidden" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <!-- Panel 2: Sandbox Mode -->
    <section id="panel-sandbox" class="screen-panel hidden">
      <h2 style="font-size:var(--font-size-xl);margin-bottom:8px;">點陣直覺探索沙盒</h2>
      <p style="color:var(--text-secondary);margin-bottom:16px;">
        自由點選兩數，觀察點陣方格排列與分組，點擊「旋轉視角」理解乘法交換律！
      </p>

      const dlg = document.getElementById('level-clear-dialog');
      if (dlg?.close) dlg.close();
      this.showScreen('adventure-map');
      this.renderAdventureMap();
      this.renderHeaderStats();
    });
  }

  switchMode(mode) {
    this.currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });

    document.getElementById('panel-adventure')?.classList.toggle('hidden', mode !== 'adventure');
    document.getElementById('panel-sandbox')?.classList.toggle('hidden', mode !== 'sandbox');
    document.getElementById('panel-table')?.classList.toggle('hidden', mode !== 'table');

    if (mode === 'adventure') {
      this.showScreen('adventure-map');
    }
  }

  showScreen(screenId) {
    document.getElementById('screen-adventure-map')?.classList.toggle('hidden', screenId !== 'adventure-map');
    document.getElementById('screen-adventure-play')?.classList.toggle('hidden', screenId !== 'adventure-play');
  }

  renderHeaderStats() {
    let total = 0;
    Object.values(this.savedState.stars || {}).forEach((s) => (total += s));
    const el = document.getElementById('stat-total-stars');
    if (el) el.textContent = `${total} / 30 ⭐️`;
  }

  /* ----------------- ADVENTURE MODE ----------------- */

  renderAdventureMap() {
    const grid = document.getElementById('level-grid');
    if (!grid) return;

    grid.innerHTML = CAMPAIGN_LEVELS.map((lvl) => {
      const earned = this.savedState.stars[lvl.id] || 0;
      const starsStr = earned > 0 ? '⭐️'.repeat(earned) : '☆☆☆';
      return `
        <div class="level-card" data-level="${lvl.id}" role="button" tabindex="0">
          <div class="level-card-header">
            <span class="level-number">第 ${lvl.id} 關</span>
            <span class="level-stars">${starsStr}</span>
          </div>
          <div class="level-name" style="font-weight:700;margin-bottom:4px;">${lvl.title.split('：')[1]}</div>
          <div class="level-desc">${lvl.desc}</div>
        </div>
      `;
    }).join('');

    grid.querySelectorAll('.level-card').forEach((card) => {
      card.addEventListener('click', (e) => {
        playPop();
        const lvlId = Number(e.currentTarget.dataset.level);
        this.startLevel(lvlId);
      });
    });
  }

  startLevel(lvlId) {
    const lvl = CAMPAIGN_LEVELS.find((l) => l.id === lvlId);
    if (!lvl) return;

    this.activeLevel = lvl;
    this.questions = generateLevelQuestions(lvl);
    this.qIndex = 0;
    this.mistakes = 0;
    this.isAnswerChecked = false;

    this.showScreen('adventure-play');
    this.renderQuestion();
  }

  renderQuestion() {
    this.isAnswerChecked = false;
    const q = this.questions[this.qIndex];
    const total = this.questions.length;

    // Progress bar
    const fill = document.getElementById('quiz-progress-fill');
    if (fill) fill.style.width = `${((this.qIndex) / total) * 100}%`;

    const titleEl = document.getElementById('quiz-level-title');
    if (titleEl) titleEl.textContent = `${this.activeLevel.title}（第 ${this.qIndex + 1} / ${total} 題）`;

    const promptEl = document.getElementById('quiz-prompt-text');
    if (promptEl) promptEl.textContent = q.prompt;

    const hintEl = document.getElementById('quiz-hint');
    if (hintEl) hintEl.textContent = q.hint || '';

    // Render array helper
    const vizContainer = document.getElementById('quiz-viz-preview');
    if (vizContainer) {
      vizContainer.innerHTML = renderArraySvg(q.a, q.b, { dotRadius: 10, gap: 4 });
    }

    const input = document.getElementById('answer-input');
    if (input) {
      input.value = '';
      input.disabled = false;
      input.focus();
    }

    const feedback = document.getElementById('quiz-feedback');
    if (feedback) {
      feedback.className = 'feedback-banner hidden';
      feedback.textContent = '';
    }

    const submitBtn = document.getElementById('btn-submit-answer');
    if (submitBtn) submitBtn.textContent = '送出答案';
  }

  handleAnswerSubmit() {
    if (this.isAnswerChecked) {
      // Proceed to next question
      this.qIndex++;
      if (this.qIndex >= this.questions.length) {
        this.finishLevel();
      } else {
        playPop();
        this.renderQuestion();
      }
      return;
    }

    const input = document.getElementById('answer-input');
    const feedback = document.getElementById('quiz-feedback');
    const submitBtn = document.getElementById('btn-submit-answer');
    const q = this.questions[this.qIndex];

    const val = input.value.trim();
    if (!val) return;

    const num = Number(val);
    if (num === q.expected) {
      // Correct!
      playVictory();
      this.isAnswerChecked = true;
      input.disabled = true;
      feedback.className = 'feedback-banner success';
      feedback.textContent = `🎉 太棒了！答對了！${q.a} × ${q.b} = ${q.a * q.b}`;
      submitBtn.textContent = '下一題 →';
    } else {
      // Incorrect!
      playError();
      this.mistakes++;
      const diag = diagnoseError(q, val);
      feedback.className = 'feedback-banner error';
      feedback.textContent = `💡 ${diag.message}`;
    }
  }

  finishLevel() {
    const stars = calculateStars(this.questions.length, this.mistakes);
    const prevStars = this.savedState.stars[this.activeLevel.id] || 0;
    if (stars > prevStars) {
      this.savedState.stars[this.activeLevel.id] = stars;
      this.saveState();
    }

    playVictory();
    const dlg = document.getElementById('level-clear-dialog');
    const starsEl = document.getElementById('clear-stars');
    const msgEl = document.getElementById('clear-message');

    if (starsEl) starsEl.textContent = '⭐️'.repeat(stars) + '☆'.repeat(3 - stars);
    if (msgEl) {
      msgEl.textContent = `你完成了${this.activeLevel.title}！答錯次數：${this.mistakes} 次。`;
    }

    if (dlg?.showModal) dlg.showModal();
  }

  /* ----------------- SANDBOX EXPLORER ----------------- */

  renderSandbox() {
    // Generate A and B selector pills
    const selA = document.getElementById('selector-a');
    const selB = document.getElementById('selector-b');

    if (selA && selA.children.length === 0) {
      for (let i = 1; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.className = `num-pill ${i === this.sandboxA ? 'active' : ''}`;
        btn.textContent = i;
        btn.addEventListener('click', () => {
          playPop();
          this.sandboxA = i;
          this.renderSandbox();
        });
        selA.appendChild(btn);
      }
    } else if (selA) {
      selA.querySelectorAll('.num-pill').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === this.sandboxA);
      });
    }

    if (selB && selB.children.length === 0) {
      for (let i = 1; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.className = `num-pill ${i === this.sandboxB ? 'active' : ''}`;
        btn.textContent = i;
        btn.addEventListener('click', () => {
          playPop();
          this.sandboxB = i;
          this.renderSandbox();
        });
        selB.appendChild(btn);
      }
    } else if (selB) {
      selB.querySelectorAll('.num-pill').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === this.sandboxB);
      });
    }

    // Render SVG
    const container = document.getElementById('sandbox-svg-container');
    if (container) {
      container.innerHTML = renderArraySvg(this.sandboxA, this.sandboxB, {
        isRotated: this.sandboxRotated,
        dotRadius: 13,
      });
    }

    // Formula card
    const formula = document.getElementById('sandbox-formula');
    if (formula) {
      const prod = this.sandboxA * this.sandboxB;
      if (this.sandboxRotated) {
        formula.innerHTML = `${this.sandboxB} × ${this.sandboxA} = <strong>${prod}</strong>（旋轉視角交換律）`;
      } else {
        formula.innerHTML = `${this.sandboxA} × ${this.sandboxB} = <strong>${prod}</strong>`;
      }
    }
  }

  /* ----------------- 9x9 TABLE MATRIX ----------------- */

  renderTable() {
    const tableEl = document.getElementById('matrix-table');
    if (!tableEl) return;

    const data = getMultiplicationTable();
    let html = '<thead><tr><th>×</th>';
    for (let c = 1; c <= 9; c++) html += `<th>${c}</th>`;
    html += '</tr></thead><tbody>';

    for (let r = 0; r < 9; r++) {
      html += `<tr><th>${r + 1}</th>`;
      for (let c = 0; c < 9; c++) {
        const item = data[r][c];
        html += `<td data-a="${item.a}" data-b="${item.b}">${item.product}</td>`;
      }
      html += '</tr>';
    }
    html += '</tbody>';
    tableEl.innerHTML = html;

    tableEl.querySelectorAll('td').forEach((td) => {
      td.addEventListener('click', (e) => {
        playPop();
        tableEl.querySelectorAll('td').forEach((el) => el.classList.remove('selected'));
        e.currentTarget.classList.add('selected');
        const a = Number(e.currentTarget.dataset.a);
        const b = Number(e.currentTarget.dataset.b);

        const detail = document.getElementById('table-detail');
        if (detail) {
          detail.innerHTML = `
            <div style="margin-top:12px;font-size:1.1rem;font-weight:700;color:#0284c7;">
              ${a} × ${b} = ${a * b}（${b} 個 ${a} 連加：${Array(b).fill(a).join(' + ')}）
            </div>
            <div style="margin-top:8px;">
              ${renderArraySvg(a, b, { dotRadius: 8, gap: 3 })}
            </div>
          `;
        }
      });
    });
  }
}

return { GameController };
})();
